name: gfs_backup
description: >-
  Grandfather-Father-Son backup retention and rotation in pure Dart, with no
  dependencies: decide which daily generations to keep (7 daily / 4 weekly /
  6 monthly), rotate them on any backend you plug in, or keep a rotating
  local archive.
version: 0.1.0
repository: https://github.com/DynasR/gfs_backup
issue_tracker: https://github.com/DynasR/gfs_backup/issues
topics:
  - backup
  - retention
  - rotation
  - archive

environment:
  sdk: ">=3.5.0 <4.0.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
